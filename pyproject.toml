[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abundant-titans"
version = "0.1.0"
description = "Streaming Titans memory for pretrained Llama language models"
requires-python = ">=3.12"
dependencies = ["torch==2.9.1", "transformers==4.57.1", "safetensors>=0.4.5"]

[project.optional-dependencies]
gpu = [
    "sglang==0.5.7; sys_platform == 'linux'",
    "liger-kernel==0.6.4; sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9"]

[tool.setuptools.packages.find]
include = ["titans*"]

[tool.setuptools.package-data]
titans = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
